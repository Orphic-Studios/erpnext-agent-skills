[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext-agent-skills"
version = "1.0.0"
description = "Universal AI Agent Skills Suite for Frappe Framework & ERPNext v15"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Orphic Studios", email = "maintainers@orphic-studios.com" }
]
keywords = [
    "erpnext",
    "frappe",
    "ai-agents",
    "agent-skills",
    "llm",
    "automation",
    "erp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0"
]

[project.urls]
Homepage = "https://github.com/Orphic-Studios/erpnext-agent-skills"
Documentation = "https://docs.frappe.io"
Repository = "https://github.com/Orphic-Studios/erpnext-agent-skills.git"
"Bug Tracker" = "https://github.com/Orphic-Studios/erpnext-agent-skills/issues"
Changelog = "https://github.com/Orphic-Studios/erpnext-agent-skills/blob/main/CHANGELOG.md"
